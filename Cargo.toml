[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "reference"
path = "src/bin/reference.rs"

[[bin]]
name = "shopping"
path = "src/bin/shopping.rs"

[dependencies]
parquet = { version = "60.2.0", default-features = false }
rayon = "1"
memmap2 = "0.9"
memchr = "2"
hashbrown = "0.16"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
panic = "abort"
debug = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
